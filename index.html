<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيدلية السلطان — المتجر الإلكتروني</title>
<meta name="description" content="صيدلية السلطان — تسوق منتجات العناية بالبشرة والشعر والجمال والعناية الشخصية ومنتجات الطفل والأدوية والمكملات الغذائية">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --navy:#0b2c58; --blue:#1c6fb0; --green:#1a8f4c; --red:#d3222a;
    --bg:#f2f5f8; --card:#ffffff; --border:#e1e6ec; --text:#1c2733; --muted:#6b7686;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;padding:22px 24px;text-align:center}
  header h1{margin:0;font-size:26px}
  header p{margin:6px 0 0;font-size:14px;opacity:.9}
  .toolbar{
    position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);
    padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;z-index:10
  }
  .toolbar input[type=text]{
    flex:1;min-width:200px;max-width:320px;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px
  }
  .cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .cat-btn{
    border:1px solid var(--border);background:#fff;color:var(--text);padding:8px 14px;border-radius:20px;
    cursor:pointer;font-size:13px;white-space:nowrap
  }
  .cat-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.15s;
  }
  .card:hover{box-shadow:0 6px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
  .card.highlight{outline:3px solid var(--green)}
  .imgbox{background:#fafbfc;display:flex;align-items:center;justify-content:center;padding:10px}
  .imgbox img{max-width:100%;height:auto;display:block;border-radius:6px}
  .info{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .info .tag{align-self:flex-start;background:#eaf2fb;color:var(--blue);padding:2px 10px;border-radius:12px;font-size:11px}
  .info h3{margin:2px 0;font-size:15px;line-height:1.4}
  .info .desc{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1}
  .info .price{font-size:16px;font-weight:700;color:var(--navy)}
  .info .code{font-size:11px;color:var(--muted);font-family:monospace}
  .order-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;
    border:none;padding:11px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:6px;border-radius:0 0 12px 12px
  }
  .order-btn:hover{background:#1ebe57}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  .count-info{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
  header .brand{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
  header .brand img{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  header h1{margin:0;font-size:26px}
  .new-banner{
    display:none;background:#fff3cd;color:#7a5b00;border-bottom:1px solid #f0dfa0;
    text-align:center;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer
  }
  .new-banner.show{display:block}
  .wa-float{
    position:fixed;bottom:22px;right:22px;z-index:999;
    background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none;
  }
  .wa-float:hover{background:#1ebe57}

  .actions-row{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .add-cart-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--navy);
    border:1.5px solid var(--navy);padding:9px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:8px
  }
  .add-cart-btn:hover{background:#eef3f9}
  .add-cart-btn.added{background:var(--green);color:#fff;border-color:var(--green)}
  .order-btn{border-radius:8px}

  .cart-float{
    position:fixed;bottom:22px;left:22px;z-index:999;
    background:var(--navy);color:#fff;width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:26px;border:none;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .cart-float:hover{background:#123a72}
  .cart-badge{
    position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:50%;
    min-width:22px;height:22px;padding:0 4px;font-size:12px;font-weight:700;display:none;
    align-items:center;justify-content:center;border:2px solid #fff;
  }
  .cart-badge.show{display:flex}

  .cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;
    align-items:center;justify-content:center;padding:16px;
  }
  .cart-overlay.show{display:flex}
  .cart-panel{
    background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:85vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .cart-header{
    background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between
  }
  .cart-header h2{margin:0;font-size:17px}
  .cart-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  .cart-body{padding:12px 20px;overflow-y:auto;flex:1}
  .cart-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .cart-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  .cart-item .ci-info{flex:1;min-width:0}
  .cart-item .ci-name{font-size:14px;font-weight:600;margin:0 0 4px}
  .cart-item .ci-code{font-size:11px;color:var(--muted);font-family:monospace}
  .cart-item .ci-price{font-size:13px;color:var(--navy);font-weight:700;margin-top:4px}
  .qty-box{display:flex;align-items:center;gap:8px}
  .qty-box button{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center
  }
  .qty-box span{min-width:20px;text-align:center;font-weight:700}
  .ci-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px}
  .cart-footer{padding:16px 20px;border-top:1px solid var(--border);background:#fafbfc}
  .cart-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:12px;color:var(--navy)}
  .cart-actions{display:flex;gap:10px}
  .cart-send{
    flex:1;background:#25D366;color:#fff;border:none;padding:12px;border-radius:8px;font-size:14.5px;
    font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px
  }
  .cart-send:hover{background:#1ebe57}
  .cart-clear{background:#fff;color:var(--red);border:1px solid var(--red);padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  .cart-empty{text-align:center;color:var(--muted);padding:40px 10px}

  .loading-state{
    grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:70px 20px;color:var(--muted);gap:14px
  }
  .spinner{
    width:38px;height:38px;border:4px solid var(--border);border-top-color:var(--blue);
    border-radius:50%;animation:spin .8s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="شعار صيدلية السلطان">
    <h1>صيدلية السلطان</h1>
  </div>
  <p>نحن نهتم بصحتك — منتجات أصلية ومعتمدة</p>
</header>
<div class="new-banner" id="newBanner">🆕 تمت إضافة منتجات جديدة منذ آخر زيارة لك — اضغط هنا لعرضها</div>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="🔍 ابحث بالاسم أو كود المنتج...">
</div>
<div class="toolbar" style="border-top:none;padding-top:0">
  <div class="cats" id="catButtons"></div>
</div>

<div class="wrap">
  <div class="count-info" id="countInfo"></div>
  <div class="grid" id="grid">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <div>⏳ برجاء الانتظار، جاري تحميل العروض...</div>
    </div>
  </div>
</div>

<footer>© صيدلية السلطان — تواصل عبر واتساب: 0552933233</footer>

<a class="wa-float" id="waFloat" href="https://wa.me/966552933233" target="_blank" rel="noopener" title="تواصل معنا عبر واتساب">💬</a>

<button class="cart-float" id="cartFloat" title="سلة المشتريات">
  🛒
  <span class="cart-badge" id="cartBadge">0</span>
</button>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-panel">
    <div class="cart-header">
      <h2>🛒 سلة المشتريات</h2>
      <button class="cart-close" id="cartClose">×</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </div>
</div>

<script src="db.js"></script>
<script>
let ALL_PRODUCTS = [];
let ACTIVE_CAT = "";

/* ---------------- عداد الزيارات (بدون حساب - CounterAPI مجاني) ---------------- */
const VISIT_NAMESPACE = "alsultanph4-lab-sultan-store";
fetch(`https://api.counterapi.dev/v1/${VISIT_NAMESPACE}/visits/up`).catch(() => {});

/* ---------------- تنبيه المنتجات الجديدة منذ آخر زيارة ---------------- */
function checkNewProducts(products) {
  if (!products.length) return;
  const latest = Math.max(...products.map(p => p.createdAt || 0));
  const lastSeen = parseInt(localStorage.getItem("sultan_last_seen") || "0", 10);
  const banner = document.getElementById("newBanner");
  if (latest > lastSeen) {
    banner.classList.add("show");
    banner.addEventListener("click", () => {
      localStorage.setItem("sultan_last_seen", String(latest));
      banner.classList.remove("show");
      document.getElementById("grid").scrollIntoView({ behavior: "smooth" });
    });
  } else {
    localStorage.setItem("sultan_last_seen", String(latest));
  }
}

async function loadProducts() {
  // 1) نحاول أولًا تحميل ملف products.json (يعمل على أي استضافة ساكنة)
  // نستخدم "no-cache" بدل "no-store" مع رابط ثابت (بدون معلّم وقت) حتى يستفيد
  // المتصفح من التحقق الشرطي (304) بدل تنزيل الملف بالكامل في كل زيارة
  try {
    const res = await fetch("products.json", { cache: "no-cache" });
    if (res.ok) {
      const json = await res.json();
      const products = Array.isArray(json) ? json : (json.products || []);
      if (products.length) return products;
    }
  } catch (e) { /* تجاهل، ننتقل للبديل */ }

  // 2) البديل: القراءة من IndexedDB (مفيد أثناء المعاينة المحلية قبل النشر)
  try {
    const local = await dbGetAll();
    return local;
  } catch (e) {
    return [];
  }
}

function buildCategoryButtons() {
  const wrap = document.getElementById("catButtons");
  const allBtn = document.createElement("button");
  allBtn.className = "cat-btn active";
  allBtn.textContent = "الكل";
  allBtn.addEventListener("click", () => setCategory("", allBtn));
  wrap.appendChild(allBtn);

  CATEGORIES.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.textContent = c.label;
    btn.addEventListener("click", () => setCategory(c.key, btn));
    wrap.appendChild(btn);
  });
}

function setCategory(key, btnEl) {
  ACTIVE_CAT = key;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btnEl.classList.add("active");
  render();
}

function render() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const params = new URLSearchParams(location.search);
  const highlightCode = params.get("code");

  const filtered = ALL_PRODUCTS.filter(p => {
    const matchCat = !ACTIVE_CAT || p.category === ACTIVE_CAT;
    const matchQ = !q || (p.name || "").toLowerCase().includes(q) || (p.code || "").toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById("countInfo").textContent = `عدد المنتجات المعروضة: ${filtered.length}`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة حاليًا 🙁</div>`;
    return;
  }

  filtered.forEach(p => {
    const productUrl = `${location.origin}${location.pathname}?code=${encodeURIComponent(p.code)}`;
    const waLink = whatsappOrderLink(p, productUrl);

    const card = document.createElement("div");
    card.className = "card" + (highlightCode && highlightCode === p.code ? " highlight" : "");
    card.id = "prod-" + p.code;
    card.innerHTML = `
      <div class="imgbox"><img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy"></div>
      <div class="info">
        <span class="tag">${categoryLabel(p.category)}</span>
        <h3>${escapeHtml(p.name)}</h3>
        ${p.description ? `<div class="desc">${escapeHtml(p.description)}</div>` : ""}
        ${p.price ? `<div class="price">${p.price} ريال</div>` : ""}
        <div class="code">كود المنتج: ${p.code}</div>
      </div>
      <div class="actions-row">
        <button class="add-cart-btn" data-code="${p.code}">➕ أضف للسلة</button>
        <a class="order-btn" href="${waLink}" target="_blank" rel="noopener">
          📱 اطلب مباشرة
        </a>
      </div>
    `;
    grid.appendChild(card);
  });

  if (highlightCode) {
    const el = document.getElementById("prod-" + highlightCode);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 200);
  }
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

document.getElementById("searchBox").addEventListener("input", render);

/* ================= السلة (طلب أكثر من صنف برسالة واحدة) ================= */
const CART_KEY = "sultan_cart";

function loadCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
  catch (e) { return []; }
}
function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}
function getCart() { return loadCart(); }

function addToCart(code) {
  const cart = loadCart();
  const existing = cart.find(i => i.code === code);
  if (existing) existing.qty += 1;
  else cart.push({ code, qty: 1 });
  saveCart(cart);
}

function changeQty(code, delta) {
  const cart = loadCart();
  const item = cart.find(i => i.code === code);
  if (!item) return;
  item.qty += delta;
  const next = item.qty > 0 ? cart : cart.filter(i => i.code !== code);
  saveCart(next);
  renderCart();
}

function removeFromCart(code) {
  const next = loadCart().filter(i => i.code !== code);
  saveCart(next);
  renderCart();
}

function updateCartBadge() {
  const total = loadCart().reduce((sum, i) => sum + i.qty, 0);
  const badge = document.getElementById("cartBadge");
  badge.textContent = total;
  badge.classList.toggle("show", total > 0);
}

function renderCart() {
  const cart = loadCart();
  const body = document.getElementById("cartBody");
  const footer = document.getElementById("cartFooter");

  if (cart.length === 0) {
    body.innerHTML = `<div class="cart-empty">🛒 السلة فارغة حاليًا<br>أضف منتجات من المتجر لتظهر هنا</div>`;
    footer.innerHTML = "";
    return;
  }

  let total = 0;
  let missingAny = false;
  body.innerHTML = cart.map(item => {
    const p = ALL_PRODUCTS.find(pr => pr.code === item.code);
    if (!p) { missingAny = true; return ""; }
    const lineTotal = (p.price || 0) * item.qty;
    total += lineTotal;
    return `
      <div class="cart-item">
        <img src="${p.image}" alt="${escapeHtml(p.name)}">
        <div class="ci-info">
          <p class="ci-name">${escapeHtml(p.name)}</p>
          <div class="ci-code">الكود: ${p.code}</div>
          ${p.price ? `<div class="ci-price">${p.price} ريال × ${item.qty} = ${lineTotal.toFixed(2)} ريال</div>` : ""}
        </div>
        <div class="qty-box">
          <button onclick="changeQty('${p.code}', 1)">+</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${p.code}', -1)">−</button>
        </div>
        <button class="ci-remove" onclick="removeFromCart('${p.code}')" title="حذف">🗑️</button>
      </div>
    `;
  }).join("");

  const waLink = buildCartWhatsAppLink(cart);
  footer.innerHTML = `
    <div class="cart-total">
      <span>الإجمالي التقديري</span>
      <span>${total.toFixed(2)} ريال</span>
    </div>
    ${missingAny ? `<div style="font-size:12px;color:var(--red);margin-bottom:8px">⚠️ بعض المنتجات لم تعد متوفرة وتم تجاهلها من الإجمالي</div>` : ""}
    <div class="cart-actions">
      <button class="cart-clear" id="cartClearBtn">🗑️ إفراغ السلة</button>
      <a class="cart-send" href="${waLink}" target="_blank" rel="noopener">📤 إرسال الطلب عبر واتساب</a>
    </div>
  `;
  document.getElementById("cartClearBtn").addEventListener("click", () => {
    if (confirm("هل تريد إفراغ السلة بالكامل؟")) { saveCart([]); renderCart(); }
  });
}

function buildCartWhatsAppLink(cart) {
  const lines = ["مرحباً، أرغب بطلب المنتجات التالية:", ""];
  let total = 0;
  cart.forEach((item, idx) => {
    const p = ALL_PRODUCTS.find(pr => pr.code === item.code);
    if (!p) return;
    const lineTotal = (p.price || 0) * item.qty;
    total += lineTotal;
    lines.push(`${idx + 1}) ${p.name} — الكود: ${p.code} — الكمية: ${item.qty}${p.price ? ` — ${lineTotal.toFixed(2)} ريال` : ""}`);
  });
  if (total > 0) lines.push("", `الإجمالي التقديري: ${total.toFixed(2)} ريال`);
  lines.push("", `رابط المتجر: ${location.origin}${location.pathname}`);
  return `https://wa.me/966552933233?text=${encodeURIComponent(lines.join("\n"))}`;
}

function openCart() { renderCart(); document.getElementById("cartOverlay").classList.add("show"); }
function closeCart() { document.getElementById("cartOverlay").classList.remove("show"); }

document.getElementById("cartFloat").addEventListener("click", openCart);
document.getElementById("cartClose").addEventListener("click", closeCart);
document.getElementById("cartOverlay").addEventListener("click", (e) => {
  if (e.target.id === "cartOverlay") closeCart();
});

// تفويض النقر لزر "أضف للسلة" على كل بطاقة منتج
document.getElementById("grid").addEventListener("click", (e) => {
  const btn = e.target.closest(".add-cart-btn");
  if (!btn) return;
  addToCart(btn.dataset.code);
  const original = btn.textContent;
  btn.textContent = "✅ أُضيف للسلة";
  btn.classList.add("added");
  setTimeout(() => { btn.textContent = original; btn.classList.remove("added"); }, 1200);
});

(async function init() {
  buildCategoryButtons();
  ALL_PRODUCTS = await loadProducts();
  ALL_PRODUCTS.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  render();
  checkNewProducts(ALL_PRODUCTS);
  updateCartBadge();
})();
</script>
</body>
</html>
